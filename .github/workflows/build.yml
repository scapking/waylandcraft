name: Build waylandcraft release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to create (e.g. v0.2.21). Leave empty to only build the jar artifacts.'
        required: false
        default: ''
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  compile-native-libs:
    strategy:
      matrix:
        platform:
          - name: linux-gnu-x86_64
            runs-on: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - name: linux-gnu-arm64
            runs-on: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.platform.runs-on }}
    steps:
    - uses: actions/checkout@v6
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y pkg-config \
          libpipewire-0.3-dev \
          libxkbcommon-dev \
          libdrm-dev \
          libgbm-dev \
          libudev-dev \
          libwayland-dev \
          libegl-dev \
          mesa-common-dev \
          libxcb1-dev \
          libxcb-cursor-dev \
          libxcb-xfixes0-dev \
          libxcb-randr0-dev \
          libxcb-composite0-dev
    - name: Setup rust toolchain
      uses: dtolnay/rust-toolchain@stable
    - name: Compile native library (release)
      working-directory: native/
      env:
        WAYLANDCRAFT_GIT_HASH: ${{ github.sha }}
      run: cargo build --release --target=${{ matrix.platform.target }}
    - name: Move native library
      run: |
        mkdir native-libs
        mv native/target/${{ matrix.platform.target }}/release/libwaylandcraft.so \
          native-libs/libwaylandcraft-${{ matrix.platform.name }}.so
    - name: Collect runtime shared library dependencies
      # Copy the non-glibc .so dependencies (libxkbcommon/libpipewire/...) next to
      # the native lib. Stripped runtimes such as the OnyxLauncher Android JRE lack
      # them; bundling lets the Java side preload them before loading libwaylandcraft.so
      # on desktop-class glibc runtimes.
      run: |
        python3 scripts/collect_deps.py native-libs/libwaylandcraft-${{ matrix.platform.name }}.so
        echo "--- bundled deps ---"
        ls -la native-libs/deps/ || true
    - name: Upload artifact
      uses: actions/upload-artifact@v7
      with:
        name: libwaylandcraft-${{ matrix.platform.name }}
        path: native-libs/
        if-no-files-found: error

  # Build bionic (Android) libxkbcommon + libpipewire with the NDK so the
  # waylandcraft native lib can load on Android launchers (e.g. OnyxLauncher).
  # The OnyxLauncher JRE is a bionic runtime: glibc .so files can never load
  # there (no libc.so.6), so the deps must be built against bionic libc too.
  compile-android-deps:
    strategy:
      matrix:
        target:
          - name: arm64
            cpu_family: aarch64
            ndk_clang: aarch64-linux-android30-clang
          - name: x86_64
            cpu_family: x86_64
            ndk_clang: x86_64-linux-android30-clang
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v6
    - name: Install NDK + build tools
      run: |
        sudo apt-get update
        sudo apt-get install -y meson ninja-build pkg-config unzip curl xz-utils
        curl -sSLo /tmp/ndk.zip https://dl.google.com/android/repository/android-ndk-r27c-linux.zip
        unzip -q /tmp/ndk.zip -d /opt
        echo "NDK=/opt/android-ndk-r27c" >> "$GITHUB_ENV"
    - name: Write meson cross file
      run: |
        # bionic (Android) has no libintl (gettext). Provide a no-op stub header
        # so pipewire can compile; translations are irrelevant on Android.
        mkdir -p /tmp/bionic-stub
        cat > /tmp/bionic-stub/libintl.h <<'EOF'
        #ifndef LIBINTL_STUB_H
        #define LIBINTL_STUB_H
        #define _(String) (String)
        #define N_(String) (String)
        #define gettext(msgid) (msgid)
        #define dgettext(domainname, msgid) (msgid)
        #define dngettext(domainname, msgid, msgid_plural, n) ((n) == 1 ? (msgid) : (msgid_plural))
        #define textdomain(domainname) ((char*)(domainname))
        #define bindtextdomain(domainname, dirname) ((char*)(domainname))
        #define bind_textdomain_codeset(domainname, codeset) ((char*)(codeset))
        #endif
        EOF
        cat > /tmp/android-cross.ini <<EOF
        [binaries]
        c = '${{ env.NDK }}/toolchains/llvm/prebuilt/linux-x86_64/bin/${{ matrix.target.ndk_clang }}'
        cpp = '${{ env.NDK }}/toolchains/llvm/prebuilt/linux-x86_64/bin/${{ matrix.target.ndk_clang }}++'
        ar = '${{ env.NDK }}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar'
        strip = '${{ env.NDK }}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip'
        [built-in options]
        c_args = ['-I/tmp/bionic-stub', '-D_GNU_SOURCE']
        cpp_args = ['-I/tmp/bionic-stub', '-D_GNU_SOURCE']
        [host_machine]
        system = 'android'
        cpu_family = '${{ matrix.target.cpu_family }}'
        cpu = '${{ matrix.target.name }}'
        endian = 'little'
        EOF
    - name: Build libxkbcommon (bionic)
      run: |
        git clone --depth 1 --branch xkbcommon-1.7.0 https://github.com/xkbcommon/libxkbcommon.git
        meson setup libxkbcommon/build libxkbcommon --cross-file /tmp/android-cross.ini \
          -Denable-x11=false -Denable-wayland=false -Denable-docs=false \
          -Denable-tools=false -Denable-bash-completion=false -Denable-xkbregistry=false
        ninja -C libxkbcommon/build
        ls -la libxkbcommon/build/libxkbcommon.so*
    - name: Build libpipewire (bionic)
      run: |
        git clone --depth 1 --branch 1.4.0 https://gitlab.freedesktop.org/pipewire/pipewire.git
        # pipewire 1.4.0 bug: module-echo-cancel references plugin_dependencies which
        # is only defined by spa/plugins/filter-graph; with -Dspa-plugins=disabled the
        # variable is undefined. We don't need echo-cancel, so drop the reference.
        sed -i 's/dependencies : \[mathlib, dl_lib, pipewire_dep, plugin_dependencies\],/dependencies : [mathlib, dl_lib, pipewire_dep],/' \
          pipewire/src/modules/meson.build
        # bionic (Android) has no pthread_cancel; it is only called when a loop is
        # created with PW_KEY_LOOP_CANCEL=true which our usage never sets, so stub it.
        sed -i 's/pthread_cancel(loop->thread);/\/\/ pthread_cancel unavailable on bionic; loop->cancel never set by waylandcraft/' \
          pipewire/src/pipewire/data-loop.c
        # bionic pthread_setaffinity_np needs API 36 (we target API 30) and waylandcraft
        # never sets CPU affinity; stub the call so pipewire still compiles.
        sed -i 's/return -pthread_setaffinity_np(thread, sizeof(set), \&set);/return -ENOSYS; \/\/ bionic: pthread_setaffinity_np needs API 36, waylandcraft never uses affinity/' \
          pipewire/src/pipewire/thread.c
        meson setup pipewire/build pipewire --cross-file /tmp/android-cross.ini \
          -Ddbus=disabled -Dpipewire-alsa=disabled -Dpipewire-jack=disabled \
          -Dflatpak=disabled -Dsnap=disabled \
          -Dudev=disabled -Dsystemd=disabled -Dsession-managers=disabled -Dgstreamer=disabled \
          -Dtests=disabled -Dexamples=disabled -Ddocs=disabled -Dman=disabled -Dspa-plugins=disabled \
          -Dalsa=disabled -Djack=disabled -Dsndfile=disabled -Dv4l2=disabled
        ninja -C pipewire/build
        find pipewire/build -name "libpipewire-0.3.so*" -o -name "libspa*.so*" | head
    - name: Assemble bionic deps bundle
      run: |
        PREFIX=bionic-prefix
        mkdir -p $PREFIX/lib/pkgconfig $PREFIX/include/xkbcommon \
                 $PREFIX/include/pipewire-0.3 $PREFIX/include/spa-0.2
        # libxkbcommon: library + headers (cross-built soname is libxkbcommon.so)
        cp -P $(find libxkbcommon/build -maxdepth 1 -name 'libxkbcommon.so*' ! -name '*.p') $PREFIX/lib/
        cp -r libxkbcommon/include/xkbcommon/* $PREFIX/include/xkbcommon/
        # pipewire: library + headers (+ extensions, protocol dirs)
        cp -P $(find pipewire/build/src/pipewire -maxdepth 1 -name 'libpipewire-0.3.so*' ! -name '*.p') $PREFIX/lib/
        cp -r pipewire/src/pipewire $PREFIX/include/pipewire-0.3/
        # version.h is generated by meson at build time, not present in the source
        # tree; libspa-sys wrapper.h includes <pipewire/version.h>. The cp -r above
        # nests into include/pipewire-0.3/pipewire/ (dest dir already exists), so
        # version.h must land in the same nested location.
        cp -P pipewire/build/src/pipewire/version.h $PREFIX/include/pipewire-0.3/pipewire/version.h
        # spa: library + headers (libspa-sys needs libspa-0.2.pc)
        cp -P $(find pipewire/build/spa/lib -maxdepth 1 -name 'libspa.so*' ! -name '*.p') $PREFIX/lib/
        cp -r pipewire/spa/include/spa $PREFIX/include/spa-0.2/
        # pkg-config files (prefix resolved relative to the .pc location so the
        # bundle works wherever it lands in CI)
        cat > $PREFIX/lib/pkgconfig/xkbcommon.pc <<'EOF'
        prefix=${pcfiledir}/../..
        libdir=${prefix}/lib
        includedir=${prefix}/include

        Name: xkbcommon
        Description: XKB API common
        Version: 1.7.0
        Libs: -L${libdir} -lxkbcommon
        Cflags: -I${includedir}
        EOF
        cat > $PREFIX/lib/pkgconfig/libpipewire-0.3.pc <<'EOF'
        prefix=${pcfiledir}/../..
        libdir=${prefix}/lib
        includedir=${prefix}/include

        Name: libpipewire
        Description: PipeWire
        Version: 1.4.0
        Libs: -L${libdir} -lpipewire-0.3
        Cflags: -I${includedir}/pipewire-0.3 -I${includedir}/spa-0.2
        EOF
        cat > $PREFIX/lib/pkgconfig/libspa-0.2.pc <<'EOF'
        prefix=${pcfiledir}/../..
        libdir=${prefix}/lib
        includedir=${prefix}/include

        Name: libspa
        Description: Simple Plugin API
        Version: 0.2
        Libs: -L${libdir} -lspa
        Cflags: -I${includedir}/pipewire-0.3 -I${includedir}/spa-0.2
        EOF
        echo "--- bundle ---"
        find $PREFIX -type f -o -type l | sort
    - name: Upload artifact
      uses: actions/upload-artifact@v7
      with:
        name: android-deps-${{ matrix.target.name }}
        path: bionic-prefix/
        if-no-files-found: error

  compile-native-android:
    needs: compile-android-deps
    strategy:
      matrix:
        target:
          - name: arm64
            rust_target: aarch64-linux-android
            linker: aarch64-linux-android30-clang
            env_upper: AARCH64_LINUX_ANDROID
          - name: x86_64
            rust_target: x86_64-linux-android
            linker: x86_64-linux-android30-clang
            env_upper: X86_64_LINUX_ANDROID
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v6
    - name: Install NDK + pkg-config + libclang (for bindgen)
      run: |
        sudo apt-get update
        sudo apt-get install -y pkg-config clang libclang-dev curl unzip
        curl -sSLo /tmp/ndk.zip https://dl.google.com/android/repository/android-ndk-r27c-linux.zip
        unzip -q /tmp/ndk.zip -d /opt
        echo "NDK=/opt/android-ndk-r27c" >> "$GITHUB_ENV"
        # put NDK clang on PATH so cc/build scripts can find <triple>-clang
        echo "/opt/android-ndk-r27c/toolchains/llvm/prebuilt/linux-x86_64/bin" >> "$GITHUB_PATH"
    - name: Download bionic deps
      uses: actions/download-artifact@v8
      with:
        path: bionic
        pattern: android-deps-${{ matrix.target.name }}
        merge-multiple: true
    - name: Setup rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: ${{ matrix.target.rust_target }}
    - name: Compile native library (android release)
      working-directory: native/
      env:
        PKG_CONFIG_ALLOW_CROSS: "1"
        PKG_CONFIG_PATH: ${{ github.workspace }}/bionic/lib/pkgconfig
        # bindgen (libspa-sys) must not pick up the host glibc headers when
        # cross-compiling: point it at the NDK bionic sysroot + android target.
        BINDGEN_EXTRA_CLANG_ARGS: --target=${{ matrix.target.rust_target }} --sysroot=${{ env.NDK }}/toolchains/llvm/prebuilt/linux-x86_64/sysroot
        # cc crate (libspa-sys C files) needs the android clang; give it the
        # exact CC_<triple> name so it doesn't guess wrong.
        CC_${{ matrix.target.rust_target }}: ${{ env.NDK }}/toolchains/llvm/prebuilt/linux-x86_64/bin/${{ matrix.target.linker }}
        # cc-rs looks for "<target>-clang" but NDK only ships the API-suffixed
        # variant (e.g. x86_64-linux-android30-clang); give it the full path.
        CARGO_TARGET_${{ matrix.target.env_upper }}_CC: ${{ env.NDK }}/toolchains/llvm/prebuilt/linux-x86_64/bin/${{ matrix.target.linker }}
        CARGO_TARGET_${{ matrix.target.env_upper }}_LINKER: ${{ env.NDK }}/toolchains/llvm/prebuilt/linux-x86_64/bin/${{ matrix.target.linker }}
        CARGO_TARGET_${{ matrix.target.env_upper }}_AR: ${{ env.NDK }}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar
      run: cargo build --release --target=${{ matrix.target.rust_target }}
    - name: Move native library + bundled deps
      run: |
        mkdir -p native-libs/deps
        cp native/target/${{ matrix.target.rust_target }}/release/libwaylandcraft.so \
          native-libs/libwaylandcraft-android-${{ matrix.target.name }}.so
        # Android cross-builds may not produce versioned symlinks (libxkbcommon.so
        # instead of libxkbcommon.so.0); copy whatever exists and create the .so.0
        # alias when missing so DT_NEEDED resolution works either way.
        cp -P $(find bionic/lib -maxdepth 1 -name 'libxkbcommon.so*' ! -name '*.p') native-libs/deps/ 2>/dev/null || true
        cp -P $(find bionic/lib -maxdepth 1 -name 'libpipewire-0.3.so*' ! -name '*.p') native-libs/deps/ 2>/dev/null || true
        cp -P $(find bionic/lib -maxdepth 1 -name 'libspa.so*' ! -name '*.p') native-libs/deps/ 2>/dev/null || true
        ls native-libs/deps/
        if [ ! -e native-libs/deps/libxkbcommon.so.0 ] && [ -e native-libs/deps/libxkbcommon.so ]; then
          ln -s libxkbcommon.so native-libs/deps/libxkbcommon.so.0
        fi
        if [ ! -e native-libs/deps/libpipewire-0.3.so.0 ] && [ -e native-libs/deps/libpipewire-0.3.so ]; then
          ln -s libpipewire-0.3.so native-libs/deps/libpipewire-0.3.so.0
        fi
        if [ ! -e native-libs/deps/libspa.so.0 ] && [ -e native-libs/deps/libspa.so ]; then
          ln -s libspa.so native-libs/deps/libspa.so.0
        fi
        printf 'libxkbcommon.so.0\nlibpipewire-0.3.so.0\nlibspa.so.0\n' > native-libs/deps/deps.list
        echo "--- native-libs ---"
        ls -la native-libs/ native-libs/deps/
        file native-libs/*.so native-libs/deps/*.so || true
        readelf -d native-libs/libwaylandcraft-android-${{ matrix.target.name }}.so 2>/dev/null | grep -i needed || true
    - name: Upload artifact
      uses: actions/upload-artifact@v7
      with:
        name: libwaylandcraft-android-${{ matrix.target.name }}
        path: native-libs/
        if-no-files-found: error

  # Single-jar release model (v1.2.16+): one universal jar that bundles every
  # native platform + every architecture + all native-deps + xwayland-satellite
  # + full Java bytecode + assets. Install on Linux / Android / Windows / macOS
  # / iOS / dedicated server — the mod auto-detects the running platform and
  # skips local capture on viewer-only hosts (Windows / macOS / iOS).
  # Matches the EVV1E upstream's "one jar, install anywhere" model.
  build-java:
    needs: [compile-native-libs, compile-native-android]
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v6
    - name: Download all native libs
      uses: actions/download-artifact@v8
      with:
        path: native-libs
        pattern: libwaylandcraft-*
        merge-multiple: true
    - name: Verify native libs
      run: |
        ls -la native-libs/
        ls -la native-libs/deps/ || true
        file native-libs/*.so native-libs/deps/*.so || true
    - name: Set up JDK 25
      uses: actions/setup-java@v5
      with:
        java-version: '25'
        distribution: 'temurin'
    - name: Setup gradle
      uses: gradle/actions/setup-gradle@v6
    - name: Build java code (universal)
      run: ./gradlew build
    - name: Verify jar contents
      run: python3 scripts/verify_jar.py universal
    - name: Upload jar artifact
      uses: actions/upload-artifact@v7
      with:
        name: waylandcraft-jar-universal
        path: build/libs/waylandcraft-universal.jar
        if-no-files-found: error

  # Cut a GitHub Release whenever a v* tag is pushed. Depends on the
  # build-java job so we never publish a jar that did not pass CI. Mirrors
  # the release: job in scapking/RenderCraft's .github/workflows/build.yml:
  #   - precise if-trigger (only tag pushes or explicit manual dispatch)
  #   - explicit `id` outputs for tag + version
  #   - gradle.properties is the single source of truth for the version
  #   - jar is renamed to waylandcraft-<version>.jar before upload so the
  #     asset name carries the mod_version number (matches the EVV1E
  #     upstream's `waylandcraft-<version>.jar` convention)
  release:
    needs: build-java
    runs-on: ubuntu-24.04
    # Only fire on tag pushes and on manual dispatch with an explicit
    # tag override. Branch pushes still run the build; they just skip
    # the release step.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        || github.event_name == 'workflow_dispatch' && inputs.tag != ''
    steps:
    - uses: actions/checkout@v6
      with:
        # fetch history + tags so release notes can diff commits against
        # the previous release tag.
        fetch-depth: 0
        fetch-tags: true

    - name: Resolve release tag
      id: tag
      run: |
        set -e
        if [ -n "${{ github.event.inputs.tag }}" ]; then
          TAG="${{ github.event.inputs.tag }}"
        else
          TAG="${GITHUB_REF_NAME}"
        fi
        case "$TAG" in
          v*) ;;
          *) echo "Refusing to release under '$TAG' (does not start with v)"; exit 1 ;;
        esac
        echo "tag=$TAG" >> "$GITHUB_OUTPUT"
        echo "Resolved release tag: $TAG"

    - name: Read mod_version
      id: ver
      run: |
        # Source of truth: gradle.properties. Stays in lock-step with what
        # the jar was built from.
        VERSION=$(grep '^mod_version=' gradle.properties | cut -d= -f2)
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"
        echo "mod_version=$VERSION"

    - name: Download jar artifact
      uses: actions/download-artifact@v8
      with:
        path: jars
        pattern: waylandcraft-jar-*
        merge-multiple: true

    - name: List and rename jar
      run: |
        set -e
        cd jars
        echo "=== downloaded tree ==="
        find . -type f | sort
        echo
        echo "=== renaming ==="
        for f in $(find . -name '*.jar' -not -name '*-sources.jar'); do
          target="waylandcraft-${{ steps.ver.outputs.version }}.jar"
          if [ "$f" = "$target" ]; then
            echo "  $f (no rename needed)"
          else
            echo "  $f -> $target"
            mv "$f" "$target"
          fi
        done
        # Sources jars: keep one per build with the version suffix.
        for f in $(find . -name '*-sources.jar'); do
          target="waylandcraft-${{ steps.ver.outputs.version }}-sources.jar"
          if [ "$f" = "$target" ]; then
            echo "  $f (no rename needed)"
          else
            echo "  $f -> $target"
            mv "$f" "$target"
          fi
        done
        echo
        echo "=== final jars/ ==="
        ls -la
        echo
        echo "=== final sha256 ==="
        sha256sum *.jar

    - name: Generate release notes
      env:
        TAG: ${{ steps.tag.outputs.tag }}
      run: |
        # Notes = per-version changelog (commits since previous release tag)
        # + the platform/asset summary.
        set -e
        PREV=$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || echo "")
        {
          echo "## 变更内容 (Changes)"
          echo ""
          if [ -n "$PREV" ]; then
            echo "Since \`${PREV}\`:"
            echo ""
            git log --pretty=format:'- `%h` %s' --no-merges "${PREV}..${TAG}" || true
          else
            echo "First release, or no previous tag found; showing the last 30 commits on ${TAG}:"
            echo ""
            git log --pretty=format:'- `%h` %s' --no-merges -30 "${TAG}" || true
          fi
          echo ""
          echo ""
          echo "---"
          echo ""
          echo "## 平台与产物 (Platforms & Assets)"
          echo ""
          echo "**Single universal jar** — install on every supported platform."
          echo "The mod auto-detects the host OS at startup:"
          echo ""
          echo "- **Linux x86_64 / arm64** — full capture + share + view (Portal ScreenCast / PipeWire / xwayland-satellite)"
          echo "- **Android x86_64 / arm64** — full capture + share + view (OnyxLauncher, etc.)"
          echo "- **Windows / macOS / iOS** — viewer-only (receives shared windows, no local capture; native platform auto-detect skips libwaylandcraft.so)"
          echo "- **Dedicated server** — pure Java server-side logic (give / permission / share)"
          echo ""
          echo "- waylandcraft-${{ steps.ver.outputs.version }}.jar"
          echo ""
          echo "源码包 (Source code): zip / tar.gz 由 GitHub 自动附加。"
        } > notes.md
        echo "=== release notes ==="
        cat notes.md

    - name: Create or update GitHub Release
      env:
        GH_TOKEN: ${{ github.token }}
        TAG: ${{ steps.tag.outputs.tag }}
      run: |
        set -e
        cd jars
        if gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
          echo "Release ${TAG} exists, updating notes + uploading assets (clobber)"
          gh release edit "${TAG}" --repo "${GITHUB_REPOSITORY}" \
            --notes-file "${GITHUB_WORKSPACE}/notes.md"
          gh release upload "${TAG}" *.jar --repo "${GITHUB_REPOSITORY}" --clobber
        else
          echo "Creating release ${TAG}"
          gh release create "${TAG}" *.jar --repo "${GITHUB_REPOSITORY}" \
            --title "${TAG}" --notes-file "${GITHUB_WORKSPACE}/notes.md"
        fi
