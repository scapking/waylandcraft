plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

// Single-jar release model (v1.2.16+):
// waylandcraft-universal.jar is the only release artifact. It bundles every
// native platform + every architecture + all native-deps + xwayland-satellite
// for the desktop Linux arches, plus the full Java bytecode + assets. The mod
// auto-detects the running platform at startup (WaylandCraftBridge.
// nativePlatform() returns null on Windows / macOS / iOS so the mod runs in
// viewer-only mode; returns "android" on Android launchers so the bionic
// libwaylandcraft-android-<arch>.so is preferred over the linux-gnu one).
//
// Rationale: the EVV1E upstream ships a single 45 MB universal jar; the
// per-arch split that scapking adopted in 2025 created 11 jars that each user
// had to pick from, and the per-arch jars are ~24 MB combined vs the upstream
// 45 MB single jar — split mostly just adds download friction. Reverting to
// the upstream's "one jar, install anywhere" model.
//
// Legacy gradle properties are accepted but ignored:
//   -PwlArch=arm64|x86_64    → no-op (universal has both)
//   -PwlPlatform=...         → no-op (universal has all)
//   -PwlServer=true          → no-op (universal runs everywhere)
def wlArch     = providers.gradleProperty('wlArch').getOrElse('')
def wlPlatform = providers.gradleProperty('wlPlatform').getOrElse('')
def wlServer   = providers.gradleProperty('wlServer').getOrElse('') == 'true'
if (wlArch || wlPlatform || wlServer) {
	logger.warn("wlArch / wlPlatform / wlServer are deprecated; the v1.2.16+ build only emits waylandcraft-universal.jar (one jar for all platforms).")
}

base {
	archivesName = "${project.archives_base_name}-universal"
}

repositories {
	// Add repositories to retrieve artifacts from in here.
	// You should only use this when depending on other mods because
	// Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
	// See https://docs.gradle.org/current/userguide/declaring_repositories.html
	// for more information about repositories.
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

	// JNA for X11 window listing (packed into jar)
	implementation "net.java.dev.jna:jna:5.14.0"
	implementation "net.java.dev.jna:jna-platform:5.14.0"

	testImplementation "org.junit.jupiter:junit-jupiter:5.10.2"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher"

}

test {
	useJUnitPlatform()
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": inputs.properties.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	inputs.property "archivesName", project.base.archivesName
	version = null

	// host lib (native/target/release) is the same file as the linux-gnu-<hostArch>
	// entry below; `EXCLUDE` keeps the first copy and skips duplicates so the
	// archive doesn't fail with a duplicate-entry error.
	duplicatesStrategy = DuplicatesStrategy.EXCLUDE

	from("LICENSE") {
		rename { "${it}_${inputs.properties.archivesName}"}
	}

	// Universal: every native platform the CI matrix produces.
	// - linux-gnu x86_64 + arm64:        desktop, full capture/share/view
	// - android x86_64 + arm64:          stripped runtimes (OnyxLauncher etc.)
	// The Windows / macOS / iOS native archs do not have a Wayland compositor
	// to capture from, so the mod runs in viewer-only mode there (no native lib
	// to load). Server is pure Java, no native payload, no satellite.
	def allTargets = [
		"linux-gnu-x86_64",
		"linux-gnu-arm64",
		"android-x86_64",
		"android-arm64",
	]
	def desktopTargets = [
		"linux-gnu-x86_64",
		"linux-gnu-arm64",
	]

	// Host-arch native lib, if a local `cargo build` produced one. Identical
	// content as the matching native-libs/ entry below; EXCLUDE above drops
	// the duplicate. Prefer the debug build (matches the CI build mode set
	// by .github/workflows/build.yml since v1.2.17; the release build's
	// stripped symbols make stack traces unreadable in user crash reports).
	def hostNative = file("native/target/debug/libwaylandcraft.so")
	if (!hostNative.exists()) {
		hostNative = file("native/target/release/libwaylandcraft.so")
	}
	if (hostNative.exists()) {
		def hostArch = System.getProperty("os.arch").toLowerCase()
		def hostArchName = (hostArch.contains("aarch64") || hostArch.contains("arm64")) ? "arm64" : "x86_64"
		with(copySpec {
			from(hostNative)
			rename { "libwaylandcraft-linux-gnu-${hostArchName}.so" }
		})
	}

	for (def target in allTargets) {
		def f = file("native-libs/libwaylandcraft-${target}.so")
		if (!f.exists()) continue

		with(copySpec {
			from(f)
		})

		// Bundle the .so runtime dependencies (libxkbcommon/libpipewire/...)
		// that CI collected under native-libs/deps. The Java side
		// (WaylandCraftBridge.loadBundledNativeDeps) reads
		// native-deps/<target>/deps.list and preloads them before loading
		// libwaylandcraft.so on stripped runtimes.
		def depsDir = file("native-libs/deps")
		if (depsDir.exists()) {
			with(copySpec {
				from(depsDir)
				into("native-deps/${target}")
			})
		}
	}

	// xwayland-satellite binary (built by native/build-satellite.sh) so X11
	// apps get a DISPLAY without the user installing satellite. Desktop Linux
	// only — Android launchers have no X11/XWayland, and viewer-only/server
	// platforms have no X11 either.
	for (def target in desktopTargets) {
		def f = file("native/xwayland-satellite-${target}")
		if (!f.exists()) continue

		with(copySpec {
			from(f)
		})
	}
}

loom {
	runs {
		client {
			environmentVariable("LD_LIBRARY_PATH", "../native/target/debug/")
			environmentVariable("__GL_THREADED_OPTIMIZATIONS", "0")
		}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish your artifact to here.
		// Notice: This block does NOT have the same function as the block at the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving your artifacts from.
	}
}