plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

// Optional -PwlArch=arm64|x86_64 selects a single-arch jar
// Optional -PwlPlatform=linux-gnu|android|windows|macos|ios selects the platform
// (used by the CI matrix). Without them the jar bundles all native platforms.
//
// Windows/macOS/iOS have no native capture backend (no Wayland compositor), so
// their jars are viewer-only: no native lib, no satellite, no bionic deps. The
// mod detects this at runtime and runs in viewer-only mode.
//
// -PwlServer=true  → waylandcraft-server.jar: server-side logic only, no native
//                    payload (capture happens on clients). Pure Java, arch-independent.
// -PwlUniversal=true or no platform flags → waylandcraft-universal.jar: bundles
//                    all native platforms (linux-gnu + android × x86_64/arm64) as
//                    a catch-all fallback.
def wlArch = providers.gradleProperty('wlArch').getOrElse('')
def wlPlatform = providers.gradleProperty('wlPlatform').getOrElse('')
def wlServer = providers.gradleProperty('wlServer').getOrElse('') == 'true'
def wlUniversal = providers.gradleProperty('wlUniversal').getOrElse('') == 'true'
def viewerPlatforms = ['windows', 'macos', 'ios']
def isViewer = wlPlatform in viewerPlatforms
def isServer = wlServer
def isUniversal = wlUniversal || (!wlArch && !isViewer && !isServer)
def platformName = (wlPlatform == 'android') ? 'android' : (wlPlatform == 'linux-gnu' ? 'linux' : wlPlatform)

base {
	archivesName = isServer ? "${project.archives_base_name}-server" : (isUniversal ? "${project.archives_base_name}-universal" : (wlArch ? "${project.archives_base_name}-${platformName}-${wlArch}" : project.archives_base_name))
}

repositories {
	// Add repositories to retrieve artifacts from in here.
	// You should only use this when depending on other mods because
	// Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
	// See https://docs.gradle.org/current/userguide/declaring_repositories.html
	// for more information about repositories.
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
	
	// JNA for X11 window listing (packed into jar)
	implementation "net.java.dev.jna:jna:5.14.0"
	implementation "net.java.dev.jna:jna-platform:5.14.0"
	
	testImplementation "org.junit.jupiter:junit-jupiter:5.10.2"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher"
	
}

test {
	useJUnitPlatform()
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": inputs.properties.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	inputs.property "archivesName", project.base.archivesName
	version = null

	// host lib（native/target/release）与 native-libs/ 里同名 .so 是同一文件，
	// 保留先加入的即可，避免 duplicate entry 打包失败。
	duplicatesStrategy = DuplicatesStrategy.EXCLUDE

	from("LICENSE") {
		rename { "${it}_${inputs.properties.archivesName}"}
	}

	// Human readable list of compiled native libraries that were found
	def natives = []

	// Host-specific native library
	// 优先使用 release 构建（3.7MB），只有 release 不存在时才退回 debug 构建。
	// debug 构建（176MB）曾导致发布 39MB 大 jar 的问题。
	// 按 host 架构重命名打进 jar（libwaylandcraft-linux-gnu-<arch>.so），
	// 不要使用无后缀的 /libwaylandcraft.so —— 否则 arm64 设备会优先加载到
	// x86_64 的 host 库而崩溃（EM_X86_64 instead of EM_AARCH64）。
	// 指定 -PwlArch 时跳过 host lib，只打包该架构的库。
	// Viewer-only 平台（windows/macos/ios）与 server jar 也不打 host lib。
	if(!wlArch && !isViewer && !isServer) {
		def nativeFile = file("native/target/release/libwaylandcraft.so")
		if(!nativeFile.exists()) {
			nativeFile = file("native/target/debug/libwaylandcraft.so")
		}
		if(nativeFile.exists()) {
			def hostArch = System.getProperty("os.arch").toLowerCase()
			def hostArchName = (hostArch.contains("aarch64") || hostArch.contains("arm64")) ? "arm64" : "x86_64"
			with(copySpec {
				from(nativeFile)
				rename { "libwaylandcraft-linux-gnu-${hostArchName}.so" }
			})
			natives.add("host")
		}
	}

	// Packaging of libraries in directory `native-libs`
	// Used by the actions runner for releases.
	// - server jar: no native payload at all.
	// - universal jar: all native platforms (linux-gnu + android × arch).
	// - single platform: only that platform's lib.
	def targets
	if(isServer) {
		targets = []
	} else if(isUniversal) {
		targets = [
			"linux-gnu-x86_64",
			"linux-gnu-arm64",
			"android-x86_64",
			"android-arm64"
		]
	} else if(wlArch) {
		targets = ["${(wlPlatform ?: 'linux-gnu')}-${wlArch}"]
	} else {
		targets = [
			"linux-gnu-x86_64",
			"linux-gnu-arm64"
		]
	}

	for(def target in targets) {
		def f = file("native-libs/libwaylandcraft-${target}.so")
		if(!f.exists()) continue;

		with(copySpec {
			from(f)
		})
		natives.add("${target}")

		// Bundle the .so runtime dependencies (libxkbcommon/libpipewire/...) that CI
		// collected next to the native lib. On stripped runtimes (e.g. Android
		// launchers) these are missing from the system, so the Java side preloads
		// them from /native-deps/<target>/ before loading libwaylandcraft.so.
		def depsDir = file("native-libs/deps")
		if(depsDir.exists()) {
			with(copySpec {
				from(depsDir)
				into("native-deps/${target}")
			})
		}
	}

	// Bundled xwayland-satellite binaries (built by native/build-satellite.sh)
	// so X11 apps get a DISPLAY without the user installing satellite themselves.
	// Desktop (linux) only: Android launchers have no X11/Xwayland, and
	// viewer-only platforms (windows/macos/ios) and the server jar have no X11 either.
	def satelliteTargets = (wlPlatform == 'android' || isViewer || isServer) ? [] : (wlArch ? ["linux-gnu-${wlArch}"] : [
		"linux-gnu-x86_64",
		"linux-gnu-arm64"
	]);
	for(def target in satelliteTargets) {
		def f = file("native/xwayland-satellite-${target}")
		if(!f.exists()) continue;

		with(copySpec {
			from(f)
		})
	}

	// Viewer-only and server jars intentionally carry no native library.
	if(natives.size() < 1 && !isViewer && !isServer) {
		ant.fail("native library not built!")
	}
}

loom {
	runs {
		client {
			environmentVariable("LD_LIBRARY_PATH", "../native/target/debug/")
			environmentVariable("__GL_THREADED_OPTIMIZATIONS", "0")
		}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}
